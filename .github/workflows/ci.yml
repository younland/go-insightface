name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -run '^$' -bench . -benchmem ./...

  linux-arm64-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: true
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
